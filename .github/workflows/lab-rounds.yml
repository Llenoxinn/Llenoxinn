# Lab rounds: keeps the profile's live cards current.
#   hourly: GitHub contributions and LeetCode
#   on push to lab/data/picoctf.json: the picoGym card is redrawn right away
name: Lab rounds

on:
  schedule:
    - cron: "37 * * * *"   # every hour, at :37
  push:
    branches: [main]
    paths: ["lab/data/picoctf.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-rounds
  cancel-in-progress: false

jobs:
  rounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab/requirements.txt

      - name: Install lab equipment
        run: pip install -r lab/requirements.txt

      - name: picoGym card
        run: python lab/build_assay.py

      - name: LeetCode card
        if: github.event_name != 'push'
        run: python lab/leetcode.py

      - name: Contributions card
        if: github.event_name != 'push'
        env:
          # The built-in token sees public activity. For private contributions too,
          # add a fine-grained token as the LAB_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.LAB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python lab/vitals.py

      - name: Check the profile before filing
        run: python lab/check_profile.py

      # Cards carry no clock, so a commit happens only when a number changes.
      - name: File the readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No new readings."
          else
            git commit -m "lab rounds: $(TZ=Asia/Manila date '+%F %H:%M')"
            # a push to main during the rounds would reject ours: replay on top and try again
            for attempt in 1 2 3; do
              git push && exit 0
              git pull --rebase origin main
            done
            exit 1
          fi
